[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivdaf"
version = "1.0.0"
description = "Intelligent Vulnerability Detection and Analysis Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "httpx>=0.27.2",
    "requests>=2.32.3",
    "python-nmap>=0.7.1",
    "pyOpenSSL>=24.2.1",
    "cryptography>=43.0.1",
    "dnspython>=2.6.1",
    "python-whois>=0.9.4",
    "reportlab>=4.2.4",
    "python-dotenv>=1.0.1",
    "rich>=13.8.1",
    "prometheus_client>=0.20.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.1",
    "pandas>=2.2.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
# Discover both 'backend' and 'frontend' from the project root.
# This is what makes `from frontend.charts import ...` resolve correctly
# even when Streamlit adds the frontend/ sub-directory to sys.path.
where = ["."]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
# Adds the project root to sys.path so both packages are importable in tests
# without requiring `pip install -e .`.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
